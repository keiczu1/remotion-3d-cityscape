interface:
  display_name: "Ranking Corridor Production"
  short_description: "Production ranking corridor: ассеты, preview, полная сборка"
  default_prompt: "Продолжи ranking corridor проект от launch-card: сначала разреши существующий `project-slug` и определи текущую фазу по файловому состоянию (`launch-card.md`, `director-pass.md`, `build-plan.md`, `review-notes.md`). После создания или обновления `director-pass.md` обязательно остановись на явный approve пользователя, зафиксированный в `review-notes.md`, и не переходи к `build-plan`, пока решение по режиссерскому плану не равно `approved`. В `preview-build` разбивай окружение на отдельные scene-задачи (`scene-1`, `scene-2`, `scene-3`, `scene-4` и далее при необходимости), а не на одну общую environment-задачу. Затем продолжай только с нужного шага — `director pass`, `build-plan`, `preview-build`, `preview-gate`, `post-preview-build`, финальное утверждение или аудит библиотеки."
