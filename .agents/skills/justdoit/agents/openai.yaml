interface:
  display_name: "justdoit"
  short_description: "Гибкий режим по умолчанию для нетривиальной работы в репозитории"
  default_prompt: "Используй $justdoit как режим по умолчанию для этой задачи: изучи репозиторий, выбери подходящую строгость процесса (`compact`, `standard` или `strict`), подготовь только действительно нужные файлы `plans.md`, `status.md` и `test-plan.md`, соблюдай анализ корневой причины для багов, сначала проверку для изменений поведения и свежую верификацию перед завершением, а затем ответь кратко на том же языке с предложением запуска и вопросом на подтверждение."
